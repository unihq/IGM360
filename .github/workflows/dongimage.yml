name: Kiểm và đóng image (GHCR)

# Mỗi lần đẩy lên bất kỳ nhánh nào: chạy bài kiểm trên Linux (nhánh riêng phải đạt đủ trước khi gộp main).
# Chỉ khi đẩy lên main: kiểm đạt thì đóng image và đẩy lên ghcr.io/unihq/igm360. VPS chỉ kéo image này về.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "tailieu/**"
      - "LICENSE"
  # Y44 (QĐ259): tugop.yml gộp bằng GITHUB_TOKEN không tự gọi tệp luồng này, nên gọi chạy tay đóng ảnh cho main.
  workflow_dispatch:

# Mặc định không cấp quyền nào; từng bước xin đúng quyền cần.
permissions: {}

jobs:
  kiemthu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 0.8.2 (CDA KT-Y43 N1): bài kiểm so PHIENBAN_LUOCDO của nhánh với origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cài thư viện đã khai
        run: pip install -r requirements.txt
      - name: Chạy bài kiểm
        shell: bash
        run: |
          # Y44e (CDA N5): đầu ra bài kiểm ghi vào tệp, KHÔNG in ra màn hình trước khi ghi chú thích, nên dòng lệnh
          # "::notice …" do bài kiểm tự in không thành chú thích. Tài liệu GitHub "Workflow commands": ::stop-commands::.
          # unittest ghi tiến độ và dòng tổng kết ra stderr; print() của bài kiểm ra stdout → tách 02 tệp, chú thích chỉ đọc
          # tệp stderr (stdout ghi dồn lúc kết thúc nên nếu chung 01 tệp, dòng in giả nằm SAU dòng tổng kết thật).
          set +e
          python -m unittest discover -s kiemthu -t . -v > /tmp/in_ra_kiem.txt 2> /tmp/ketqua_kiem.txt
          ma=$?
          set -e
          # 0.8.0: số bài ghi thành chú thích của lần chạy (đọc được qua API công khai, không cần đăng nhập GitHub).
          # Chỉ lấy 02 dòng tổng kết cuối của unittest ("Ran N tests …" rồi "OK…"/"FAILED…").
          echo "::notice title=Ket qua bai kiem::$(grep -E '^(Ran [0-9]+ tests?|OK|FAILED)' /tmp/ketqua_kiem.txt | tail -n 2 | tr '\n' ' ')"
          khoa="$(python -c 'import secrets; print(secrets.token_hex(16))')"   # mã ngẫu nhiên mỗi lượt
          echo "::stop-commands::${khoa}"
          cat /tmp/in_ra_kiem.txt /tmp/ketqua_kiem.txt   # in để xem; dòng lệnh "::…::" trong đây không còn tác dụng
          echo "::${khoa}::"
          exit "$ma"

  # 0.10.1 P7 (QĐ683): đo giao diện như người dùng bằng trình duyệt có sẵn của máy GitHub – máy thử trong thư mục tạm, tài khoản
  # thử, mật khẩu và khóa 02 lớp tạo lúc chạy. Việc riêng: chỉ quyền đọc mã, 0 khóa bí mật, 0 gói; không tải ảnh lên, chỉ ghi bảng
  # số đo vào tóm tắt lượt chạy (CDA K1–K8, CPO chốt K2, K8 cách B). Đã bỏ cờ chỉ báo (bỏ qua lỗi) sau 05 lượt liên tiếp đạt
  # (PD28, DEM-05-LUOT): việc này đỏ thì cả luồng đỏ, tugop.yml không tự gộp. Việc dongimage vẫn chỉ cần kiemthu.
  dogiaodien:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cài thư viện đã khai
        run: pip install -r requirements.txt
      - name: Đo giao diện
        run: python kiemthu/giaodien/maythu_ci.py

  dongimage:
    needs: kiemthu
    # Nhánh riêng chỉ chạy bài kiểm, không đóng image. (Y43 đã đo lớp bằng nhãn thu-<sha> trên nhánh capnhat-nhanh, xong
    # 24/11/2026: 1,29 MB; CDA KT-Y43 N5: bỏ đường đo trước khi gộp.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tên image chữ thường
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Đọc số phiên bản
        run: echo "PHIENBAN=$(tr -d ' \n\r' < VERSION)" >> "$GITHUB_ENV"

      # 0.8.2 (QĐ258): số bản 02 CLI ghim trong Dockerfile (không lấy bản mới nhất lúc đóng); main đẩy latest + sha + số bản.
      - name: Chọn nhãn đẩy
        shell: bash
        run: |
          { echo "NHAN<<HET"; echo "${IMAGE}:latest"; echo "${IMAGE}:${GITHUB_SHA}"; echo "${IMAGE}:${PHIENBAN}"; echo "HET"; } >> "$GITHUB_ENV"
          echo "NHAN_KT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          grep -o 'ARG [A-Z_]*_CLI_VERSION=.*' Dockerfile | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.7.9 lớp 3 (QĐ215): đóng trước (chưa đẩy), thử khởi động cả bản này lẫn bản trước để sẵn trong ảnh, đạt mới đẩy.
      - name: Đóng image (chưa đẩy)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: igm360-thu:${{ github.sha }}
          # 0.8.2 (QĐ258): ngoài bộ nhớ đệm gha (tự xóa sau 07 ngày không dùng), đọc thêm đệm gắn trong ảnh latest để lớp
          # CLI, thư viện không bị dựng lại (dựng lại là đổi mã lớp, máy chủ tải lại hàng trăm MB).
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=gha,mode=max

      # 0.8.0 (QĐ229): cụm tìm chữ H08 cần SQLite ≥ 3.43 (`contentless_delete`); thấp hơn thì không đẩy image.
      - name: Kiểm bản SQLite trong image
        shell: bash
        run: |
          docker run --rm --entrypoint python "igm360-thu:${GITHUB_SHA}" -c "import sqlite3, sys; v = tuple(map(int, sqlite3.sqlite_version.split('.'))); print('SQLite', sqlite3.sqlite_version); sys.exit(0 if v >= (3, 43, 0) else 1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Thử bản trước khởi động được
        shell: bash
        run: |
          anh="igm360-thu:${GITHUB_SHA}"
          thu() {   # $1: tệp trạng thái (rỗng = chạy bình thường); in số bản /suckhoe trả
            d="$(mktemp -d)"; chmod 777 "$d"
            [ -z "$1" ] || { printf '%s' "$1" > "$d/capnhat_trangthai.json"; chmod 666 "$d/capnhat_trangthai.json"; }
            t0="$(date +%s)"
            docker run -d --name thu -e IGM360_LICH=tat -v "$d:/dulieu" "$anh" >/dev/null
            ra=""
            for i in $(seq 1 45); do
              ra="$(docker exec thu python -c "import urllib.request,json;print(json.load(urllib.request.urlopen('http://127.0.0.1:8360/suckhoe',timeout=3))['phienban'])" 2>/dev/null || true)"
              [ -n "$ra" ] && break; sleep 2
            done
            echo "$(( $(date +%s) - t0 ))" > /tmp/giay_khoidong   # QĐ218 dòng 43: số giây thật để thay "khoảng 30 giây"
            [ -n "$ra" ] || docker logs thu 2>&1 | tail -30 >&2
            docker rm -f thu >/dev/null
            echo "$ra"
          }
          [ "$(thu '')" = "$PHIENBAN" ] || { echo "Bản $PHIENBAN chưa khởi động được"; exit 1; }
          bt="$(docker run --rm --entrypoint cat "$anh" /app/ban_truoc/VERSION 2>/dev/null | tr -d ' \n\r' || true)"
          if [ -z "$bt" ]; then echo "Ảnh $PHIENBAN chưa có bản trước (lần đầu)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ "$bt" != "$PHIENBAN" ] || { echo "Bản trước trùng bản này: $bt"; exit 1; }
          ra="$(thu "{\"chay_ban_truoc\": {\"ban_anh\": \"$PHIENBAN\", \"ban_truoc\": \"$bt\"}}")"
          [ "$ra" = "$bt" ] || { echo "Bản trước $bt chưa khởi động được trên ảnh $PHIENBAN (trả: $ra)"; exit 1; }
          echo "Bản $PHIENBAN và bản trước $bt khởi động được; bản trước lên trong $(cat /tmp/giay_khoidong) giây (máy CI, chưa tính Docker bật lại vùng chứa)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Y46 K4 (QĐ263): bộ nâng công cụ AI chạy đúng trong ảnh thật. Chép CLI có sẵn trong ảnh làm bản nâng giả (không gọi
      # npm, không gọi hãng), đổi con trỏ, chạy --version qua đường cổng AI dùng, rồi về bản trước. Chưa đạt thì không đẩy ảnh.
      - name: Kiểm bộ nâng công cụ AI trong ảnh
        shell: bash
        run: |
          d="$(mktemp -d)"; chmod 777 "$d"
          docker run -d --name thu_cli -e IGM360_LICH=tat -v "$d:/dulieu" "igm360-thu:${GITHUB_SHA}" >/dev/null
          for i in $(seq 1 45); do
            docker exec thu_cli python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8360/suckhoe',timeout=3)" 2>/dev/null && break
            sleep 2
          done
          kq=0
          docker exec -i -w /app thu_cli python - < kiemthu/vungchua/kiem_nang_cli.py | tee -a "$GITHUB_STEP_SUMMARY" || kq=$?
          [ "$kq" = 0 ] || docker logs thu_cli 2>&1 | tail -30 >&2
          docker rm -f thu_cli >/dev/null
          exit "$kq"

      - name: Đẩy image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.NHAN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Ghi kích thước image
        shell: bash
        run: |
          docker pull "${IMAGE}:${NHAN_KT}" >/dev/null
          kt="$(docker image inspect "${IMAGE}:${NHAN_KT}" --format '{{.Size}}')"
          echo "Kích thước image (giải nén): $((kt / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
