# IGM360 trên VPS: 03 dịch vụ.
#   igm360     phần mềm (chỉ nghe trong mạng nội bộ của Docker, không mở cổng ra ngoài)
#   gateway    cổng HTTPS: giữ cổng 80, 443; tự xin và gia hạn chứng chỉ
#   watchtower kéo image mới khi bấm Cập nhật ngay (chỉ dịch vụ này có quyền Docker)
# Giá trị riêng của máy (tên miền, tài khoản quản trị, mã cập nhật) nằm trong tệp .env cạnh tệp này.
# QĐ634 (0.10.0): cổng HTTPS có 02 khối. Khối tên gốc DOMAIN_NAME (.env) luôn chạy – đường dự phòng. Khối https://
#   cấp chứng chỉ khi có lời vào đầu tiên (On-Demand TLS) cho tên miền riêng đặt ở Cài đặt › Chung: trước khi xin,
#   Caddy hỏi igm360 /tls-check, chỉ tên đã lưu mới được cấp. /tls-check bị chặn (404) từ đường công khai ở cả 02 khối.
# Đăng nhập gói Claude 01 lần:  docker compose run --rm igm360 claude auth login --claudeai
name: igm360

x-ghinhatky: &ghinhatky
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

configs:
  caddyfile:
    content: |
      {
        on_demand_tls {
          ask http://igm360:8360/tls-check
        }
      }
      {$$DOMAIN_NAME} {
        encode zstd gzip
        header -Server
        respond /tls-check* 404
        reverse_proxy igm360:8360
      }
      https:// {
        tls {
          on_demand
        }
        encode zstd gzip
        header -Server
        respond /tls-check* 404
        reverse_proxy igm360:8360
      }
      http:// {
        redir https://{host}{uri}
      }

services:
  igm360:
    image: ghcr.io/unihq/igm360:latest
    container_name: igm360
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"   # chỉ container này được watchtower cập nhật
    pull_policy: always
    init: true
    networks:
      - noibo
    environment:
      FORWARDED_ALLOW_IPS: "172.30.36.10"   # chỉ tin địa chỉ IP do cổng HTTPS (gateway) chuyển tới
      IGM360_TEN_GOC: ${DOMAIN_NAME:-}       # QĐ634: tên gốc luôn dùng được; có biến này = đã bật đổi tên miền
      IGM360_ADMIN_USER: ${IGM360_ADMIN_USER:-}
      IGM360_ADMIN_PASSWORD: ${IGM360_ADMIN_PASSWORD:-}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:?Thiếu WATCHTOWER_TOKEN trong tệp .env}
    expose:
      - "8360"
    volumes:
      - igm360-dulieu:/dulieu
      - igm360-claude:/home/igm/.claude
      - igm360-codex:/home/igm/.codex
    logging: *ghinhatky

  gateway:
    image: caddy:2-alpine
    container_name: igm360-gateway
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      - igm360
    networks:
      noibo:
        ipv4_address: 172.30.36.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Thiếu DOMAIN_NAME trong tệp .env}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *ghinhatky

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: igm360-watchtower
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    # Không có mục ports: cổng nhận lệnh cập nhật (8080) chỉ nghe trong mạng nội bộ Docker, không mở ra ngoài.
    networks:
      - noibo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?Thiếu WATCHTOWER_TOKEN trong tệp .env}
      # QĐ252 (0.8.1): giới hạn chờ của lệnh cập nhật 30 phút (mặc định 10 phút; quá giờ watchtower trả 503 và bỏ dở).
      # Có từ watchtower v1.20.0 (tài liệu docs/configuration/http-api, mục HTTP API Update Timeout). Bài học kho tham khảo 13/11.
      WATCHTOWER_HTTP_API_UPDATE_TIMEOUT: 30m
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "false"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
    # 02 lớp giới hạn: chỉ container tên igm360 VÀ có nhãn cho phép.
    command: igm360
    logging: *ghinhatky

networks:
  noibo:
    # Mạng nội bộ có dải cố định để cổng HTTPS có địa chỉ cố định (phần mềm chỉ tin địa chỉ này).
    ipam:
      config:
        - subnet: 172.30.36.0/24

volumes:
  igm360-dulieu:
  igm360-claude:
  igm360-codex:
  caddy-data:
  caddy-config:
